bundle:
  name: kzn_recsys_spark

variables:
  catalog:      { default: main }
  schema:       { default: kzn_recsys }
  volume:       { default: models }
  data_mode:    { default: synthetic }   # synthetic | delta
  n_users:      { default: "500" }
  n_items:      { default: "120" }
  seed:         { default: "42" }
  k:            { default: "10" }
  ndcg_gate:    { default: "0.0" }
  strategy:     { default: collect }     # collect | distributed
  do_tune:      { default: "false" }
  days_ago_cutoff: { default: "7.0" }
  split:        { default: temporal }    # temporal | leave_last_k | random
  holdout_k:    { default: "1" }         # leave_last_k only
  availability_table:     { default: "" }  # optional: availability-aware evaluation (#101)
  user_territory_feature: { default: "" }  # optional: one-hot user-feature column for territory
  raw_engagement_table: { default: "" }  # used when data_mode=delta
  raw_metadata_table:   { default: "" }
  # Series-grain interactions table (issue #102; fease_interactions_agg_job.yml)
  agg_catalog:        { default: dsml_recs }
  agg_schema:         { default: dev }
  agg_table:          { default: fease_interactions_agg }
  viewership_table:   { default: cr_prod.gold_db.ds_viewership }
  agg_lookback_days:  { default: "3" }
  # Per-interaction / per-series attribute tables (sibling tables of agg_table).
  # The column defaults are unverified against the live gold schema; a blank
  # duration / audio / media-id column makes the dependent attributes NULL.
  attrs_table:              { default: fease_interaction_attrs }
  item_attrs_table:         { default: fease_item_attrs }
  attrs_media_id_col:       { default: catalog_media_id }
  attrs_media_duration_col: { default: catalog_media_duration }
  attrs_platform_col:       { default: view_platform_name }
  attrs_audio_col:          { default: view_audio_locale }
  attrs_completed_ratio:    { default: "0.9" }
  catalog_table:            { default: cr_prod.gold_db.ds_catalog }

artifacts:
  spark_wheel:
    type: whl
    build: python -m build --wheel
    path: ../packaging/pure-python

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
